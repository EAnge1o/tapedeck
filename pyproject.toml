[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapedeck"
version = "0.1.0"
description = "Flight recorder for LLM agents: record once, replay forever, diff what drifted. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "E'Angelo" }]
keywords = ["llm", "agent", "replay", "testing", "observability", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
tapedeck = "tapedeck.cli:main"

[tool.setuptools.packages.find]
include = ["tapedeck*"]
